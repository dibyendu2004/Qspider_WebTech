<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item{
            background-color: rgb(10, 137, 156);
            border: 2px solid white;
            font-size: 30px;
            color: white;
            height: 100px;
            width: 100px;
            text-align: center;
            line-height: 100px;
        }
        #flex-container{
            display: flex;
            /* flex-direction: row; */
            justify-content: flex-start;
            height: 100vh;
            /* align-items: baseline; */
            align-items: stretch;
            /* flex-wrap: wrap; */
            flex-flow: row wrap;
            /* flex-wrap: nowrap; */
            align-content: flex-start;

            /* column-gap: 30px;
            row-gap: 30px; */

            gap:20px 30px;
        }

        #item-1{
            font-size: 70px;
        }
    </style>
</head>
<body>
    <div id="flex-container">
        <div class="item" id="item-1">1</div>
        <div class="item" id="item-2">2</div>
        <div class="item" id="item-3">3</div>
        <div class="item" id="item-4">4</div>
        <div class="item" id="item-5">5</div>
        <div class="item" id="item-6">6</div>
        <div class="item" id="item-7">7</div>
        <div class="item" id="item-8">8</div>
    </div>
</body>
</html>
