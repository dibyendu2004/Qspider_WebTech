<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #a{
            width: 100%;
            height: 100vh;
            background-color: aqua;
        }
        @media screen and (min-height:0px) and (max-height:100px){
            #a{
                background-color: blue;
            }
        }
        @media screen and (min-height:101px) and (max-height:300px){
            #a{
                background-color: violet;
            }
        }
        @media screen and (min-height:301px) and (max-height:400px){
            #a{
                background-color: brown;
            }
        }
        @media screen and (min-height:401px) and (max-height:600px){
            #a{
                background-color:chocolate;
            }
        }
         @media screen and (min-height:601px){
            #a{
                background-color:cornflowerblue;
            }
        }
    </style>
</head>
<body>
    <div id="a"></div>
</body>
</html>
