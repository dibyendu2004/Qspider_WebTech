<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>
    <style>
        .main{
            height: 600px;
            width: 600px;
            border: 2px solid black;
        }
        #one{
            height: 500px;
            width: 500px;
            position: absolute;
            background-color: blueviolet;
            color: white;
        }
        #two{
            height: 300px;
            width: 300px;
            position: absolute;
            background-color: aqua;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="one">
            <h1>visible</h1>
        </div>
        <div id="two">
        </div>
    </div>
</body>
</html>
