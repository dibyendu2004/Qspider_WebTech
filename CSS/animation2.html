<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height:100px;
            width: 100px;
            background-color: aquamarine;
            border: 3px solid black;

            animation:example2 2s linear 1s infinite both alternate-reverse running;
        }



        body{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
        }

        @keyframes example2 {
            from{
                transform: translateX(0px);
            }
            to{
                transform: translateX(500px);
            }
        }
    </style>
</head>
<body>
    <div id="main"></div>
</body>
</html>
