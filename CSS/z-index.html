<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <style>
        #main{
            height: 600px;
            width: 600px;
            border: 2px solid black;
        }
        #a{
            height: 200px;
            width: 200px;
            background-color: blue;
            position: absolute;
            z-index: 4;
        }
        #b{
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            position: absolute;
            z-index: 13;
        }
        #c{
            height: 200px;
            width: 200px;
            background-color: red;
            position: absolute;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
    </div>
</body>
</html>
