<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            border: 3px solid red;
            height: 200px; 
            width: 200px;
        }

        h1{
            border: 3px solid green;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <!-- Inline level element -->
     <span>Hiii</span>
     <span>Helloo</span>
     <span>Byeeee</span>

     <!-- Block Level Element -->
      <h1>Hiii</h1>
      <h1>Hellooo</h1>
      <h1>Byeeee</h1>
</body>
</html>
