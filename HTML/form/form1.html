<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Register</legend>
            <label for="fname">FirstName:</label>
            <input type="text" name="fname" id="fname"> <br><br>

             <label for="lname">LastName:</label>
            <input type="text" name="lname" id="lname"> <br><br>

             <label for="email">Email:</label>
            <input type="email" name="email" id="email"> <br><br>

             <label for="password">Password:</label>
            <input type="password" name="password" id="password"> <br><br>

             <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob"> <br><br>

             <label for="phn">Ph No:</label>
            <input type="tel" name="phn" id="phn"> <br><br>

             <label for="address">Address:</label>
            <textarea rows="6" cols="15" name="address" id="address"></textarea> <br><br>

             <label for="">Gender:</label>
            <input type="radio" name="gender" id="gender">Male
            <input type="radio" name="gender" id="gender">Female
            <input type="radio" name="gender" id="gender">Others  <br><br>

             <label for="">Skills:</label>
            <input type="checkbox" name="skills" id="skills">JAVA
            <input type="checkbox" name="skills" id="skills">WEB
            <input type="checkbox" name="skills" id="skills">SQL  <br><br>

            <label for="docs">Documents:</label>
            <input type="file" name="docs" id="docs">  <br><br>

            <button type="submit">Submit</button>

        </fieldset>
    </form>
</body>
</html>
