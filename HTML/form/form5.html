<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" novalidate>
        ID: <input type="text" name="" id="" pattern="[0-9]" title="enter only number"><br><br>
        Name: <input type="text" name="" id="" minlength="3" maxlength="15" autofocus><br><br>
        age: <input type="number" name="" id="" min="18" max="60"> <br><br>
        nationality: <input type="text" name="" id="" value="INDIAN" readonly><br><br>
        Range: <input type="range" name="" id="" min="500" max="5000" step="500"><br><br>
        phoneNo: <input type="tel" name="" id="" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="enter the no like xxx-xxx-xxxx"><br><br>
        password: <input type="password" name="" id="" pattern="[0-9a-zA-Z]{8,}">

        <button type="submit">Submit</button>
        <button type="submit" disabled>Submit</button>

    </form>
</body>
</html>
